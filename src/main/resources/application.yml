spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coffee?serverTimezone=Asia/Seoul
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

    cache:
      type: redis
      redis:
        time-to-live: 60s